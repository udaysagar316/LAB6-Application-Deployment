
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab6-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab6-web-app
  template:
    metadata:
      labels:
        app: lab6-web-app
    spec:
      containers:
        - name: web
          image: lab6-web-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab6-web-service
spec:
  type: NodePort
  selector:
    app: lab6-web-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
